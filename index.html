<body>
    <h1>Air pollution model</h1>
    <canvas id="screen"></canvas>

    <h3>Gaussian Plume model. (All dimensions are in metre)</h3>
    <!-- Parameters will be displayed and controlled via UI elements here eventually -->

    <p>Concentration less than 1 microgram per m<sup>3</sup> is not rendered.</p>
    
    <!-- Load the controller as the main entry point -->
    <script type="module" src="controller.js"></script>
